<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPV ROVER</title>
    <style>
:root {
    --bg-color: #F7D1C8;
    --bg-color-gradient: #FFF4F2;
    --card-color: #C98273;

    --text-primary: #421300;
    --text-muted: #964F32;

    --btn-bg: #825349;
    --btn-hover: #54362F;
    --btn-active: #DE8F7E;
    --btn-text: #CFB6B6;
    --btn-text-hover: #F7E1E1;
    --btn-text-active: #454545;
    --shadow-color: #000;
    --status-color-no_error: #08FF00;
    --status-color-error: #ef4444;
    --status-color-no_error-bg: #088F00;
    --status-color-error-bg: #822828;
}

body.dark-theme {
    --bg-color: #050B19;
    --bg-color-gradient: #0C1D4A;
    --card-color: #0B2152;

    --text-primary: #04e5e9;
    --text-muted: #1f9d9f;

    --btn-bg: #01278F;
    --btn-hover: #041861;
    --btn-active: #04e5e9;
    --btn-text: #93c5fd;
    --btn-text-hover: #ffffff;
    --btn-text-active: #050B19;
    --shadow-color: #243373;
    --status-color-no_error-bg: #045600;
    --status-color-error-bg: #571a1a;
}

#fps-text {
    margin-left: 0.75rem;
    font-weight: normal;
    font-variant-numeric: tabular-nums;
}

* {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}

body {
    background: linear-gradient(45deg, var(--bg-color), var(--bg-color-gradient));
    background-attachment: fixed;
    min-height: 100vh;
}

.header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 1rem;
}

.header h1 {
    font-size: 1.5rem;
    color: var(--text-primary);
    grid-column: 1;
}

.header .status-container {
    grid-column: 2;
    margin: 0;
}

#mode-toggle {
    grid-column: 3;
    justify-self: end;
}

h2 {
    font-size: 1.2rem;
    display: flex;
    justify-content: center;
    color: var(--text-muted);
    margin-top: 30px;
    margin-bottom: 10px;
}

.vid-details {
    display: flex;
    justify-content: center;
    width: 88%;
    height: 50vh;
    border-radius: 1rem;
    box-shadow: 5px 5px 25px var(--shadow-color);
    margin: 0 auto;
    overflow: hidden;
    background-color: #000;
}

.vid-details img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#status {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    color: var(--status-color-no_error);
}

.status-container {
    width: fit-content;
    padding: 0.4rem 0.8rem;
    background-color: var(--status-color-no_error-bg);
    border-radius: 0.5rem;
    box-shadow: 2px 2px 12px var(--status-color-no_error);
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
}

.status-container .error { display: none; }
.status-container .no_error {
    display: inline-block;
    color: var(--status-color-no_error);
}

.status-container.has-error .error {
    display: inline-block;
    color: var(--status-color-error);
}
.status-container.has-error .no_error { display: none; }
.status-container.has-error {
    background-color: var(--status-color-error-bg);
    box-shadow: 2px 2px 12px var(--status-color-error);
}
.status-container.has-error #status { color: var(--status-color-error); }

body .sun-icon { display: none; }
body .moon-icon { display: inline-block; }
body.dark-theme .sun-icon { display: inline-block; }
body.dark-theme .moon-icon { display: none; }

#mode-toggle {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 50%;
    border: none;
    background-color: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s ease, background-color 0.3s ease, color 0.3s ease;
}

#mode-toggle svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
}

#mode-toggle:active {
    transform: scale(0.95);
    background-color: var(--btn-active);
    color: var(--btn-text-active);
}

.controls {
    display: grid;
    grid-template-columns: repeat(3, 4.5rem);
    grid-template-rows: repeat(2, 3.5rem);
    gap: 0.5rem;
    width: fit-content;
    padding: 1rem;
    margin: 2rem auto;
    border-radius: 1rem;
    background-color: var(--card-color);
    box-shadow: 5px 5px 15px var(--shadow-color);
}

.btn-up    { grid-column: 2; grid-row: 1; }
.btn-left  { grid-column: 1; grid-row: 2; }
.btn-down  { grid-column: 2; grid-row: 2; }
.btn-right { grid-column: 3; grid-row: 2; }

.control-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    border-radius: 0.5rem;
    cursor: pointer;
    transition: 0.3s ease;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

.control-btn svg { pointer-events: none; }

@media (hover: hover) {
    #mode-toggle:hover {
        transform: scale(1.15);
        background-color: var(--btn-hover);
        color: var(--btn-text-hover);
    }
    .control-btn:hover {
        background-color: var(--btn-hover);
        color: var(--btn-text-hover);
        border-radius: 1rem;
    }
}

.control-btn:active,
.control-btn.pressed {
    background-color: var(--btn-active);
    color: var(--btn-text-active);
}

.control-btn.pressed { transform: scale(0.95); }

@media (max-width: 600px) {
    .header {
        grid-template-columns: 1fr auto;
        row-gap: 0.75rem;
    }
    .header h1 {
        grid-column: 1 / -1;
        text-align: center;
        font-size: 1.3rem;
    }
    .header .status-container { grid-column: 1; justify-self: start; }
    #mode-toggle { grid-column: 2; }
    h2 { font-size: 1rem; margin-top: 16px; }
    .vid-details { width: 94vw; height: 40vh; }
}

    </style>
</head>
<body>
    <div class="header">
        <h1>Control the FPV ROVER</h1>
        <div class="status-container" id="status-container">
            <p id="status">
                <svg class="no_error" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                <svg class="error" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                <span id="status-text">Connecting...</span>
            </p>
        </div>
        <button id="mode-toggle" aria-label="Toggle dark mode">
            <svg class="moon-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg class="sun-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>
    </div>

    <h2>Live video feed<span id="fps-text"></span></h2>
    <div class="vid-details">
        <img alt="Live Video Feed Stream" id="vid-stream" draggable="false">
    </div>

    <div class="controls">
        <button class="control-btn btn-up" id="btn-up" aria-label="Forward">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
        </button>
        <button class="control-btn btn-down" id="btn-down" aria-label="Backward">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
        </button>
        <button class="control-btn btn-left" id="btn-left" aria-label="Left">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </button>
        <button class="control-btn btn-right" id="btn-right" aria-label="Right">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
    </div>
<script>
const modeToggleBtn = document.getElementById('mode-toggle');
const statusContainer = document.getElementById('status-container');
const statusText = document.getElementById('status-text');
const vidStream = document.getElementById('vid-stream');
const fpsText = document.getElementById('fps-text');

try {
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-theme');
} catch (e) {}

modeToggleBtn.addEventListener('click', () => {
    const isDark = document.body.classList.toggle('dark-theme');
    try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
});

function updateStatus(hasError) {
    statusContainer.classList.toggle('has-error', hasError);
    statusText.textContent = hasError ? 'Disconnected' : 'Connected!';
}

let ws;
function connectWS() {
    ws = new WebSocket(`ws://${window.location.hostname}/ws`);
    
    ws.onopen = () => updateStatus(false);
    
    ws.onclose = () => { 
        updateStatus(true); 
        fpsText.textContent = '';
        setTimeout(connectWS, 2000); 
    };
    
    ws.onerror = () => updateStatus(true);

    ws.onmessage = (event) => {
        if (event.data.startsWith("FPS:")) {
            fpsText.textContent = `${event.data.split(":")[1]} FPS`;
        }
    };
}
connectWS();

function sendCommand(action, isRepeat = false) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(action);
    }
}

const actionMap = {
    'btn-up': 'forward',
    'btn-down': 'backward',
    'btn-left': 'left',
    'btn-right': 'right'
};

const keyMap = {
    ArrowUp: 'btn-up',    KeyW: 'btn-up',
    ArrowDown: 'btn-down', KeyS: 'btn-down',
    ArrowLeft: 'btn-left', KeyA: 'btn-left',
    ArrowRight: 'btn-right', KeyD: 'btn-right'
};

const REPEAT_MS = 250;
let held = [];
let currentAction = null;
let repeatTimer = null;

function applyState() {
    const lastId = held[held.length - 1];
    const next = lastId ? actionMap[lastId] : null;
    if (next === currentAction) return;

    currentAction = next;
    clearInterval(repeatTimer);
    repeatTimer = null;

    if (next) {
        sendCommand(next);
        repeatTimer = setInterval(() => sendCommand(next, true), REPEAT_MS);
    } else {
        sendCommand('stop');
    }
}

function press(id) {
    if (held.includes(id)) return;
    held.push(id);
    document.getElementById(id).classList.add('pressed');
    applyState();
}

function release(id) {
    const i = held.indexOf(id);
    if (i === -1) return;
    held.splice(i, 1);
    document.getElementById(id).classList.remove('pressed');
    applyState();
}

function releaseAll() {
    held.slice().forEach(id => release(id));
}

document.addEventListener('keydown', (event) => {
    const id = keyMap[event.code];
    if (!id) return;
    event.preventDefault();
    if (!event.repeat) press(id);
});

document.addEventListener('keyup', (event) => {
    const id = keyMap[event.code];
    if (!id) return;
    event.preventDefault();
    release(id);
});

window.addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });

Object.keys(actionMap).forEach(id => {
    const btn = document.getElementById(id);
    if (!btn) return;

    btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        try { btn.setPointerCapture(e.pointerId); } catch (err) {}
        press(id);
    });
    // 🚀 Added pointerleave to fix stuck buttons
    ['pointerup', 'pointercancel', 'pointerleave', 'lostpointercapture'].forEach(type => {
        btn.addEventListener(type, () => release(id));
    });
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
});

let lastStreamStart = 0;

function startStream() {
    lastStreamStart = Date.now();
    vidStream.src = `http://${window.location.hostname}:81/stream?t=${Date.now()}`;
}

vidStream.addEventListener('error', () => {
    setTimeout(startStream, 2000);
});

startStream();

</script>
</body>
</html>
